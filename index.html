<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101419">
  <title>Media Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --line: rgba(255, 255, 255, .16);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(72, 105, 128, .25), transparent 38%),
        radial-gradient(ellipse at 90% 35%, rgba(75, 82, 120, .19), transparent 40%),
        linear-gradient(145deg, #0b0f13, #171d23 55%, #0d1116);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .section {
      width: min(1600px, 100%);
      margin: 0 auto 34px;
    }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 24px;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 26px;
    }

    .media-card {
      position: relative;
      overflow: hidden;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .035));
      box-shadow: 0 16px 45px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .12);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      cursor: pointer;
      transition: transform .22s ease, border-color .22s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, .3);
    }

    .media-card video,
    .media-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 17px;
      background: #080b0e;
    }

    .media-card img {
      aspect-ratio: 4/3;
      object-fit: contain;
      background: rgba(0, 0, 0, .18);
    }

    .photo-card {
      padding: 12px;
    }

    .split {
      width: min(1600px, 100%);
      height: 1px;
      margin: 42px auto;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
    }

    /* REELS VIEWER */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0, 0, 0, .88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .viewer.open {
      display: flex;
    }

    .viewer-content {
      width: min(1500px, 96vw);
      max-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer video,
    .viewer img {
      display: block;
      max-width: 100%;
      max-height: 88vh;
      width: auto;
      height: auto;
      border-radius: 16px;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
    }

    .viewer-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 58px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 18px;
      color: white;
      background: rgba(255, 255, 255, .12);
      font-size: 30px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      z-index: 22;
    }

    .viewer-nav.prev {
      left: 22px;
    }

    .viewer-nav.next {
      right: 22px;
    }

    .viewer-nav:disabled {
      opacity: .25;
      cursor: default;
    }

    .close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      color: white;
      background: rgba(255, 255, 255, .12);
      font-size: 27px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      z-index: 23;
    }

    @media(max-width:600px) {
      body {
        padding: 14px;
      }

      .section-grid,
      .photos {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .media-card {
        border-radius: 20px;
        padding: 8px;
      }

      .media-card video,
      .media-card img {
        border-radius: 14px;
      }

      .split {
        margin: 28px auto;
      }

      .viewer-nav.prev {
        left: 8px;
      }

      .viewer-nav.next {
        right: 8px;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- 1-VIDEO BO'LIMI -->
    <section class="section">
      <div class="section-grid" id="videos-1">

        <!-- VIDEO QO'SHISH: BLOKNI DUPLICATE QIL -->
        <div class="media-item" data-type="video" data-src="assets/1.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/2.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/3.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/4.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/5.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/6.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/7.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/8.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/9.mp4"></div>

      </div>
    </section>
    <div class="split"></div>
    <section class="section">
      <div class="photos" id="photos">
        <div class="media-item" data-type="image" data-src="assets/5.png"></div>

        <div class="media-item" data-type="image" data-src="assets/optik.png"></div>

        <div class="media-item" data-type="image" data-src="assets/optiklar.png"></div>

        <div class="media-item" data-type="image" data-src="assets/mudofa.png"></div>

        <div class="media-item" data-type="image" data-src="assets/mudofa1.png"></div>

      </div>
    </section>
    <div class="split"></div>

    <!-- 2-VIDEO BO'LIMI -->
    <section class="section">
      <div class="section-grid" id="videos-2">

        <!-- VIDEO QO'SHISH: BLOKNI DUPLICATE QIL -->
        <div class="media-item" data-type="video" data-src="assets/10.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/11.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/12.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/13.mp4"></div>

        <div class="media-item" data-type="video" data-src="assets/14.mp4"></div>

      </div>
    </section>

    <div class="split"></div>

    <!-- 3-RASMLAR BO'LIMI -->
    <section class="section">
      <div class="photos" id="photos">

        <!-- RASM QO'SHISH: BLOKNI DUPLICATE QIL -->
        <div class="media-item" data-type="image" data-src="assets/1.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/2.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/3.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/4.jpg"></div>
      </div>
    </section>
    <div class="split"></div>

    <section class="section">
      <div class="photos" id="photos">

        <!-- RASM QO'SHISH: BLOKNI DUPLICATE QIL -->
        <div class="media-item" data-type="image" data-src="assets/ornat1.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/ornat2.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/ornat3.jpg"></div>

        <div class="media-item" data-type="image" data-src="assets/ornat4.jpg"></div>
      </div>
    </section>
    <div class="split"></div>
  </main>

  <!-- REELS OYNASI -->

  <div class="viewer" id="viewer" aria-modal="true" role="dialog">
    <button class="close" id="closeViewer">×</button>
    <button class="viewer-nav prev" id="prevMedia">‹</button>
    <div class="viewer-content" id="viewerContent"></div>
    <button class="viewer-nav next" id="nextMedia">›</button>
  </div>

  <script>
    let activeGroup = [];
    let activeIndex = 0;
    let touchStartX = 0;

    const viewer = document.getElementById('viewer');
    const viewerContent = document.getElementById('viewerContent');
    const prevButton = document.getElementById('prevMedia');
    const nextButton = document.getElementById('nextMedia');

    /* HTML BLOKLARIDAN MEDIA KARTALARINI YASASH */

    function initializeMedia() {
      document.querySelectorAll('.media-item').forEach(item => {
        const type = item.dataset.type;
        const src = item.dataset.src;

        if (!src || !type) return;

        const card = document.createElement('div');
        card.className = 'media-card';

        let preview;

        if (type === 'video') {
          preview = document.createElement('video');
          preview.src = src;
          preview.autoplay = true;
          preview.muted = true;
          preview.loop = true;
          preview.playsInline = true;
          preview.preload = 'metadata';
          preview.controls = false;
          preview.play().catch(() => { });
        } else if (type === 'image') {
          preview = document.createElement('img');
          preview.src = src;
          preview.alt = '';
          preview.loading = 'lazy';
        } else {
          return;
        }

        preview.addEventListener('error', () => {
          console.error('Media yuklanmadi:', src);
          card.style.display = 'none';
        });

        card.appendChild(preview);

        card.addEventListener('click', () => {
          const container = item.parentElement;
          const group = Array.from(container.querySelectorAll('.media-item'))
            .filter(element => element.dataset.src && element.dataset.type);

          openMedia(group, group.indexOf(item));
        });

        item.replaceWith(card);
      });
    }

    /* MEDIA OCHISH */

    function openMedia(group, index) {
      activeGroup = group;
      activeIndex = index;
      renderMedia();
      viewer.classList.add('open');
    }

    /* MEDIA KO'RSATISH */

    function renderMedia() {
      const oldVideo = viewerContent.querySelector('video');

      if (oldVideo) {
        oldVideo.pause();
        oldVideo.removeAttribute('src');
        oldVideo.load();
      }

      viewerContent.replaceChildren();

      const item = activeGroup[activeIndex];
      if (!item) return;

      const src = item.dataset.src;
      const type = item.dataset.type;

      if (type === 'video') {
        const video = document.createElement('video');
        video.src = src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.muted = false;

        viewerContent.appendChild(video);
        video.play().catch(() => { });
      } else {
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        viewerContent.appendChild(img);
      }

      prevButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === activeGroup.length - 1;
    }

    /* OLDINGI / KEYINGI MEDIA */

    function moveMedia(direction) {
      const nextIndex = activeIndex + direction;

      if (nextIndex < 0 || nextIndex >= activeGroup.length) return;

      activeIndex = nextIndex;
      renderMedia();
    }

    /* OYNANI YOPISH */

    function closeViewer() {
      const video = viewerContent.querySelector('video');

      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      viewer.classList.remove('open');
      viewerContent.replaceChildren();
      activeGroup = [];
      activeIndex = 0;
    }

    /* TUGMALAR */

    document.getElementById('closeViewer').addEventListener('click', closeViewer);

    prevButton.addEventListener('click', () => moveMedia(-1));
    nextButton.addEventListener('click', () => moveMedia(1));

    /* TELEFONDA SURISH */

    viewer.addEventListener('touchstart', event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    viewer.addEventListener('touchend', event => {
      const deltaX = event.changedTouches[0].screenX - touchStartX;

      if (Math.abs(deltaX) > 55) {
        moveMedia(deltaX < 0 ? 1 : -1);
      }
    }, { passive: true });

    /* KLAVIATURA */

    viewer.addEventListener('click', event => {
      if (event.target === viewer) closeViewer();
    });

    document.addEventListener('keydown', event => {
      if (!viewer.classList.contains('open')) return;

      if (event.key === 'Escape') closeViewer();
      if (event.key === 'ArrowLeft') moveMedia(-1);
      if (event.key === 'ArrowRight') moveMedia(1);
    });

    /* ISHGA TUSHIRISH */

    initializeMedia();
  </script>

</body>

</html>
